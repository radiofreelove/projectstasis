<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" aria-hidden="true" focusable="false">
  <!-- Original mark for The Stasis Project: a still, six-sided crystal, lit from above. Not an ODHS or state logo.
       A light outer edge and a dark inner edge keep it visible on light and dark backgrounds.
       Colors are from the ODHS palette: North Star Indigo, Glacial Blue, and white. -->
  <polygon points="24,3 42.19,13.5 42.19,34.5 24,45 5.81,34.5 5.81,13.5" fill="none" stroke="#b4dcf5" stroke-width="5" stroke-linejoin="round"/>
  <polygon points="24,3 42.19,13.5 32.23,19.25 24,14.5" fill="#ffffff"/><!-- top right -->
  <polygon points="42.19,13.5 42.19,34.5 32.23,28.75 32.23,19.25" fill="#b4dcf5"/><!-- right -->
  <polygon points="42.19,34.5 24,45 24,33.5 32.23,28.75" fill="#2e3192"/><!-- bottom right -->
  <polygon points="24,45 5.81,34.5 15.77,28.75 24,33.5" fill="#2e3192"/><!-- bottom left -->
  <polygon points="5.81,34.5 5.81,13.5 15.77,19.25 15.77,28.75" fill="#b4dcf5"/><!-- left -->
  <polygon points="5.81,13.5 24,3 24,14.5 15.77,19.25" fill="#ffffff"/><!-- top left -->
  <polygon points="24,14.5 32.23,19.25 32.23,28.75 24,33.5 15.77,28.75 15.77,19.25" fill="#b4dcf5"/>
  <g stroke="#2e3192" stroke-width="1.25" stroke-linejoin="round" fill="none">
    <line x1="24" y1="3" x2="24" y2="14.5"/>
    <line x1="42.19" y1="13.5" x2="32.23" y2="19.25"/>
    <line x1="42.19" y1="34.5" x2="32.23" y2="28.75"/>
    <line x1="24" y1="45" x2="24" y2="33.5"/>
    <line x1="5.81" y1="34.5" x2="15.77" y2="28.75"/>
    <line x1="5.81" y1="13.5" x2="15.77" y2="19.25"/>
    <polygon points="24,14.5 32.23,19.25 32.23,28.75 24,33.5 15.77,28.75 15.77,19.25"/>
  </g>
  <polygon points="24,3 42.19,13.5 42.19,34.5 24,45 5.81,34.5 5.81,13.5" fill="none" stroke="#2e3192" stroke-width="2" stroke-linejoin="round"/>
</svg>
