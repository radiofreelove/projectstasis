name: Weekly source check

# Every Monday morning (Oregon time), and on Jan. 1 each year when dated
# notes expire: check every official link, what every official source says
# (the evidence audit), every dated checkpoint, and what Cloudflare serves
# at the live address. If anything needs a person, open one GitHub issue
# with the full report. Nothing in this workflow writes to the repository.
# Run it by hand from the Actions tab after any change to the Cloudflare
# settings. See docs/maintenance.md.

on:
  schedule:
    - cron: "17 15 * * 1"
    - cron: "17 15 1 1 *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check official links (respects robots.txt)
        id: links
        continue-on-error: true
        run: python3 tools/check_links.py --report link-report.md

      # The baseline holds hashes, not text. The text of each page is kept
      # between runs so a report can show what changed. If it is gone, the
      # report says so and still names the changed source.
      - name: Bring back the page text saved by earlier runs
        uses: actions/cache@v5
        with:
          path: .evidence-snapshots
          key: evidence-snapshots-${{ github.run_id }}
          restore-keys: evidence-snapshots-

      - name: Evidence audit (what each source says, compared with its baseline; respects robots.txt)
        id: evidence
        continue-on-error: true
        run: python3 tools/evidence_audit.py --report evidence-report.md

      - name: Check dated checkpoints
        id: dates
        continue-on-error: true
        run: python3 tools/check_review_dates.py > review-report.txt 2>&1

      - name: Check the live site (pages, headers, and the 404 page match this repository)
        id: live
        continue-on-error: true
        run: python3 tools/check_live.py --report live-report.md

      - name: Open an issue if a person is needed
        if: steps.links.outcome == 'failure' || steps.evidence.outcome == 'failure' || steps.dates.outcome == 'failure' || steps.live.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "The weekly source check found something that needs a person."
            echo
            echo "## Checkpoints"
            echo
            echo '```'
            cat review-report.txt 2>/dev/null || echo "(no checkpoint report)"
            echo '```'
            echo
            cat link-report.md 2>/dev/null || echo "(no link report)"
            echo
            cat evidence-report.md 2>/dev/null || echo "(no evidence audit report)"
            echo
            cat live-report.md 2>/dev/null || echo "(no live-site report)"
            echo
            echo "See docs/maintenance.md for what to do."
          } > body.md
          gh issue create \
            --title "Weekly source check needs attention ($(date -u +%Y-%m-%d))" \
            --body-file body.md
